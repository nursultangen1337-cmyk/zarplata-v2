<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Заправка ⛽</title>
<meta name="theme-color" content="#0d1117">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#30363d;--border2:#444c56;
  --green:#3fb950;--greenDim:#1a3a22;--greenBg:#0d2818;
  --amber:#d29922;--amberDim:#3a2a00;
  --red:#f85149;--redDim:#3a1210;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:960px;margin:0 auto;min-height:100vh}

.header{background:linear-gradient(180deg, #161b22 0%, #0d1117 100%);border-bottom:1px solid var(--border);padding:20px 20px 16px;text-align:center;position:sticky;top:0;z-index:50}
.header-icon{font-size:42px;margin-bottom:4px}
.header-title{font-size:24px;font-weight:800;color:var(--amber);letter-spacing:-.02em}
.header-sub{font-size:13px;color:var(--text3);margin-top:2px;font-weight:500}

.content{flex:1;padding:20px;overflow-y:auto;padding-bottom:60px}

.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.form-title{font-size:15px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:18px;display:flex;align-items:center;gap:8px}

.field{margin-bottom:18px}
.field label{display:block;font-size:14px;color:var(--text2);font-weight:600;margin-bottom:8px}
.field input,.field select{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:20px;padding:14px 16px;outline:none;transition:border-color .15s, box-shadow .15s;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(210,153,34,0.2)}
.field select option{background:var(--bg3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ВЕЛИКИЙ ЦИФРОВИЙ ДИСПЛЕЙ ДЛЯ ЛІТРІВ */
.liters-display-box{background:linear-gradient(145deg, #121820, #1a222c);border:2px solid var(--amber);border-radius:18px;padding:16px;text-align:center;margin-bottom:20px;box-shadow:inset 0 2px 10px rgba(0,0,0,0.5), 0 0 20px rgba(210,153,34,0.15)}
.liters-label{font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.liters-big-num{font-size:56px;font-weight:900;color:#fff;line-height:1.1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(210,153,34,0.4)}
.liters-unit{font-size:22px;color:var(--amber);margin-left:4px;font-weight:700}

.btn{width:100%;padding:18px;border-radius:var(--radius-sm);font-size:20px;font-weight:800;border:none;cursor:pointer;transition:all .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(.98)}
.btn-amber{background:linear-gradient(135deg, #d29922 0%, #b88014 100%);color:#0d1117;box-shadow:0 4px 15px rgba(210,153,34,0.3)}

.vehicle-chip{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;background:var(--bg3);border:1.5px solid var(--border);border-radius:24px;font-size:17px;cursor:pointer;margin:0 8px 10px 0;transition:all .15s;font-weight:600;min-height:52px}
.vehicle-chip:active{transform:scale(.96)}
.vehicle-chip.selected{background:var(--amberDim);border-color:var(--amber);color:var(--amber);box-shadow:0 0 12px rgba(210,153,34,0.2)}

.crop-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg3);border:1.5px solid var(--border);border-radius:20px;font-size:16px;cursor:pointer;margin:0 6px 8px 0;transition:all .15s;font-weight:500}
.crop-chip.selected{background:var(--greenDim);border-color:var(--green);color:var(--green)}

.section-label{font-size:13px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:24px 0 12px}

.entry-item{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;gap:14px}
.entry-icon{width:46px;height:46px;border-radius:12px;background:var(--amberDim);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.entry-info{flex:1;min-width:0}
.entry-name{font-size:16px;font-weight:700;color:var(--text)}
.entry-date{font-size:13px;color:var(--text3);margin-top:2px}
.entry-liters{font-size:22px;font-weight:800;color:var(--amber);flex-shrink:0}

.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:54px;margin-bottom:12px}
.empty-title{font-size:18px;color:var(--text2);font-weight:700;margin-bottom:6px}

.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--amberDim);border:1.5px solid var(--amber);color:var(--amber);padding:14px 28px;border-radius:30px;font-size:16px;font-weight:700;z-index:300;opacity:0;transition:opacity .25s, transform .25s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(10px)}

.money-fly{position:fixed;z-index:400;font-size:32px;font-weight:900;color:var(--amber);pointer-events:none;animation:moneyFly 1.2s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 0 16px rgba(210,153,34,0.6)}
@keyframes moneyFly{0%{opacity:1;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-80px) scale(1.4)}100%{opacity:0;transform:translateY(-160px) scale(.7)}}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px}
.stat-label{font-size:12px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-val{font-size:26px;font-weight:800;color:var(--amber)}

/* ПЛАНШЕТНА ТА МЕДІА АДАПТАЦІЯ */
@media (min-width: 600px) {
  body { max-width: 768px; }
  .liters-big-num { font-size: 72px; }
  .field input, .field select { font-size: 22px; padding: 16px 18px; }
  .btn { font-size: 22px; padding: 20px; }
}
@media (min-width: 900px) {
  body { max-width: 960px; }
  .form-card { padding: 30px; }
  .liters-big-num { font-size: 84px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">⛽</div>
  <div class="header-title">Облік пального</div>
  <div class="header-sub" id="farm-name">ФГ ПРО-АГРО</div>
</div>

<div class="content">

  <div id="no-vehicles-msg" class="empty" style="display:none">
    <div class="empty-icon">⚠️</div>
    <div class="empty-title">Транспорт ще не додано</div>
    <div style="font-size:14px;color:var(--text3)">Зверніться до керівника для налаштування транспорту.</div>
  </div>

  <div id="main-form">
    <div class="form-card">
      <div class="form-title">⛽ Нова заправка</div>
      
      <div class="field">
        <label>Оберіть транспорт *</label>
        <div id="vehicle-chips"></div>
      </div>

      <!-- ВЕЛИКИЙ ДИСПЛЕЙ ДЛЯ ТЫКАННЯ ЦИФР ВОДІЯМ -->
      <div class="liters-display-box">
        <div class="liters-label">Кількість літрів</div>
        <div>
          <span class="liters-big-num" id="big-liters-num">0</span>
          <span class="liters-unit">л</span>
        </div>
      </div>

      <div class="field-row">
        <div class="field" style="grid-column: span 2">
          <label>Введіть літри *</label>
          <input type="number" id="fuel-liters" placeholder="0" inputmode="decimal" step="0.1" min="0" oninput="updateBigDisplay(this.value)">
        </div>
      </div>
      
      <!-- АВТОМАТИЧНА ДАТА ТА ЧАС (БЕЗ РУЧНОГО ВВЕДЕННЯ) -->
      <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;font-weight:700">Дата та час заправки (автоматично)</div>
          <div style="font-size:16px;font-weight:700;color:var(--text);margin-top:2px" id="auto-date-time-display">—</div>
        </div>
        <div style="font-size:22px">⏱️</div>
      </div>

      <div class="field" id="crop-field" style="display:none">
        <label>Культура / Врожай (необов'язково)</label>
        <div id="crop-chips"></div>
      </div>

      <div class="field">
        <label>Призначення / Мета поїздки</label>
        <input type="text" id="fuel-purpose" placeholder="Наприклад: Посівна, Доставка зерна, Поле №5...">
      </div>

      <div class="field">
        <label>Примітка (необов'язково)</label>
        <input type="text" id="fuel-note" placeholder="Додаткова інформація...">
      </div>

      <button class="btn btn-amber" onclick="addEntry()">⛽ Записати заправку</button>
    </div>

    <div class="stat-row" id="stat-row">
      <div class="stat-box"><div class="stat-label">Цього місяця</div><div class="stat-val" id="stat-month">0 л</div></div>
      <div class="stat-box"><div class="stat-label">Заправок</div><div class="stat-val" id="stat-count">0</div></div>
    </div>

    <div class="section-label">Останні заправки</div>
    <div id="entries-list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDQUd7iF1kQdUEoJ4yK_8mzl3UuZIcNBIY",
  authDomain: "zarplata-275f9.firebaseapp.com",
  databaseURL: "https://zarplata-275f9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "zarplata-275f9",
  storageBucket: "zarplata-275f9.firebasestorage.app",
  messagingSenderId: "61739415470",
  appId: "1:61739415470:web:f050a9bf6ba2f1ad4d3a3f"
};

let db, fbDB = null, firebaseReady = false;
let state = {vehicles:[], fuelEntries:[], crops:[]};
let selectedVehicle = null;
let selectedCrop = null;

function updateBigDisplay(val){
  const el = document.getElementById('big-liters-num');
  if(!val || parseFloat(val) <= 0){
    el.textContent = '0';
  } else {
    el.textContent = val;
  }
}

function initFirebase(){
  try{
    if(FIREBASE_CONFIG.apiKey==='ВСТАВТЕ_API_KEY') return;
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDB = firebase.database();
    firebaseReady = true;
    fbDB.ref('zarplata_data').on('value', snap=>{
      const data=snap.val();
      if(data){
        state.vehicles = data.vehicles||[];
        state.fuelEntries = data.fuelEntries||[];
        state.crops = data.crops||[];
        if(!state.vehicles.length){
          document.getElementById('no-vehicles-msg').style.display='block';
          document.getElementById('main-form').style.display='none';
        } else {
          document.getElementById('no-vehicles-msg').style.display='none';
          document.getElementById('main-form').style.display='block';
          renderChips();renderCropChips();renderEntries();renderStats();
        }
      }
    });
  }catch(e){ firebaseReady=false; }
}

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('zarplata',2);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('data'))d.createObjectStore('data');
    };
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=()=>rej();
  });
}
function dbGet(key){
  return new Promise(res=>{
    if(!db){res(null);return;}
    const tx=db.transaction('data','readonly');
    const req=tx.objectStore('data').get(key);
    req.onsuccess=()=>res(req.result||null);
    req.onerror=()=>res(null);
  });
}
function dbSet(key,val){
  return new Promise(res=>{
    if(!db){res();return;}
    const tx=db.transaction('data','readwrite');
    tx.objectStore('data').put(val,key);
    tx.oncomplete=()=>res();
    tx.onerror=()=>res();
  });
}

function getKyivNow(){
  // Returns Date object adjusted or formatted to Europe/Kiev
  return new Date();
}

function fmtKyivDate(d){
  const opts = { timeZone: 'Europe/Kyiv', year: 'numeric', month: '2-digit', day: '2-digit' };
  const parts = new Intl.DateTimeFormat('en-CA', opts).formatToParts(d);
  const y = parts.find(p=>p.type==='year').value;
  const m = parts.find(p=>p.type==='month').value;
  const da = parts.find(p=>p.type==='day').value;
  return `${y}-${m}-${da}`;
}

function fmtKyivTime(d){
  const opts = { timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  return new Intl.DateTimeFormat('uk-UA', opts).format(d);
}

function fmtKyivTimeShort(d){
  const opts = { timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit', hour12: false };
  return new Intl.DateTimeFormat('uk-UA', opts).format(d);
}

function startLiveClock(){
  const display = document.getElementById('auto-date-time-display');
  function update(){
    const now = getKyivNow();
    if(display){
      display.textContent = displayDate(fmtKyivDate(now)) + ' · ' + fmtKyivTime(now);
    }
  }
  update();
  setInterval(update, 1000);
}

function load(){
  initFirebase();
  startLiveClock();
  if(!firebaseReady){
    openDB().then(()=>dbGet('zarplata_v3')).then(raw=>{
      if(raw){
        state.vehicles=raw.vehicles||[];
        state.fuelEntries=raw.fuelEntries||[];
        state.crops=raw.crops||[];
      }
      if(!state.vehicles.length){
        document.getElementById('no-vehicles-msg').style.display='block';
        document.getElementById('main-form').style.display='none';
      } else {
        renderChips();renderCropChips();renderEntries();renderStats();
      }
    });
  }
}

function save(){
  if(firebaseReady && fbDB){
    fbDB.ref('zarplata_data/fuelEntries').set(state.fuelEntries);
  } else {
    dbGet('zarplata_v3').then(raw=>{
      const full=raw||{};
      full.fuelEntries=state.fuelEntries;
      dbSet('zarplata_v3',full);
    });
  }
}

function renderChips(){
  const el=document.getElementById('vehicle-chips');
  el.innerHTML=state.vehicles.map(v=>`
    <div class="vehicle-chip ${selectedVehicle===v.id?'selected':''}" onclick="selectVehicle('${v.id}')">
      ${v.type.split(' ')[0]} ${v.name}
    </div>`).join('');
}
function selectVehicle(id){selectedVehicle=(selectedVehicle===id)?null:id;renderChips();}

function renderCropChips(){
  const fieldEl = document.getElementById('crop-field');
  const el = document.getElementById('crop-chips');
  if(!state.crops || !state.crops.length){
    fieldEl.style.display = 'none';
    return;
  }
  fieldEl.style.display = 'block';
  el.innerHTML = state.crops.map(c => `
    <div class="crop-chip ${selectedCrop===c?'selected':''}" onclick="selectCrop('${c}')">
      🌱 ${c}
    </div>
  `).join('');
}

function selectCrop(crop){
  selectedCrop = (selectedCrop === crop) ? null : crop;
  renderCropChips();
}

function addEntry(){
  if(!selectedVehicle){showToast('Оберіть транспорт!');return;}
  const liters=parseFloat(document.getElementById('fuel-liters').value);
  const now = new Date();
  const date = fmtKyivDate(now);
  const time = fmtKyivTimeShort(now);
  const purpose = document.getElementById('fuel-purpose') ? document.getElementById('fuel-purpose').value.trim() : '';
  let note = document.getElementById('fuel-note').value.trim();
  
  const notesParts=[];
  if(selectedCrop) notesParts.push('🌱 '+selectedCrop);
  if(purpose) notesParts.push('🎯 '+purpose);
  if(note) notesParts.push(note);
  const fullNote = notesParts.join(' · ');

  if(!liters||liters<=0){showToast('Введіть кількість літрів!');return;}
  
  const entry={id:uid(),vehicleId:selectedVehicle,liters,date,time,crop:selectedCrop||'',purpose,note:fullNote};
  state.fuelEntries.push(entry);
  save();
  
  const v=state.vehicles.find(vv=>vv.id===selectedVehicle);
  flyFuel(liters);
  document.getElementById('fuel-liters').value='';
  if(document.getElementById('fuel-purpose')) document.getElementById('fuel-purpose').value='';
  document.getElementById('fuel-note').value='';
  selectedCrop=null;
  renderCropChips();
  updateBigDisplay(0);
  
  showToast('✓ '+(v?v.name:'')+' — '+liters+' л');
  if(navigator.vibrate)navigator.vibrate([40,20,60]);
  renderEntries();renderStats();
}

function renderEntries(){
  const el=document.getElementById('entries-list');
  const entries=state.fuelEntries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  if(!entries.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">⛽</div><div class="empty-title">Ще немає заправок</div></div>';
    return;
  }
  el.innerHTML=entries.map(f=>{
    const v=state.vehicles.find(vv=>vv.id===f.vehicleId);
    const icon=v?v.type.split(' ')[0]:'🚗';
    const detail = f.note || f.purpose || '';
    const timeStr = f.time ? (' (' + f.time.slice(0,5) + ')') : '';
    return `<div class="entry-item">
      <div class="entry-icon">${icon}</div>
      <div class="entry-info">
        <div class="entry-name">${v?v.name:'—'}</div>
        <div class="entry-date">${displayDate(f.date)}${timeStr}${detail?' · '+detail:''}</div>
      </div>
      <div class="entry-liters">${f.liters.toFixed(1)} л</div>
    </div>`;
  }).join('');
}

function renderStats(){
  const now=fmtMonth(new Date());
  const monthE=state.fuelEntries.filter(f=>getMonthStr(f.date)===now);
  const totalL=monthE.reduce((a,f)=>a+f.liters,0);
  document.getElementById('stat-month').textContent=totalL.toFixed(1)+' л';
  document.getElementById('stat-count').textContent=monthE.length;
}

function flyFuel(liters){
  const btn=document.querySelector('.btn-amber');
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='money-fly';
  el.textContent='+'+liters.toFixed(1)+' л ⛽';
  el.style.left=(rect.left+rect.width/2)+'px';
  el.style.top=rect.top+'px';
  el.style.transform='translateX(-50%)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

load();
</script>
</body>
</html>
